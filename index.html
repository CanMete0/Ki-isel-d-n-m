<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dönüşüm">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Kişisel Dönüşüm</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#111827;--green:#16803c;--soft:#f0fdf4}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151a21;--text:#f5f7fa;--muted:#a6adba;--line:#29313c;--accent:#f5f7fa;--green:#4ade80;--soft:#102418}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit}
button{color:inherit}
.app{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 30px)}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:800;color:#b07b12}
.title{font-size:30px;font-weight:900;letter-spacing:-.05em}
.muted{color:var(--muted);font-size:12px}
.streak{background:var(--accent);color:var(--bg);border-radius:15px;padding:8px 12px;text-align:center;min-width:66px}
.streak b{display:block;font-size:20px}.streak span{font-size:9px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav button{border:0;background:var(--line);width:43px;height:43px;border-radius:13px;font-size:26px}
.date{text-align:center}.date b{display:block}.date small{color:var(--muted);font-size:11px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 12px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:11px;font-weight:800}
.tabs button.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.section,.meal-head{display:flex;align-items:center;justify-content:space-between}
.section h3,.card>h3{font-size:15px;margin:0 0 10px}
.progress{height:9px;background:var(--line);border-radius:20px;overflow:hidden}
.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .25s}
.water-buttons,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.grid{grid-template-columns:1fr 1fr}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;font-weight:750}
.exercise{display:flex;gap:11px;align-items:center;padding:13px 7px;border-bottom:1px solid var(--line);cursor:pointer}
.exercise:last-child{border-bottom:0}
.exercise input{width:22px;height:22px;accent-color:var(--green);flex:0 0 auto}
.exercise.done{background:var(--soft);border-radius:10px}
.exercise.done span{text-decoration:line-through;color:var(--muted)}
.meal{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px}
.meal-title{font-weight:850;font-size:14px}.meal-time{font-size:10px;color:var(--muted);margin-left:5px}
.meal textarea{margin-top:8px;min-height:64px}
textarea,input[type=number]{width:100%;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 92%,var(--bg));color:var(--text);border-radius:11px;padding:11px;outline:none}
textarea:focus,input:focus{border-color:var(--green)}
.hidden{display:none!important}
.report{padding:12px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px}
.report b{display:block}.report small{color:var(--muted)}
.stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.stat b{font-size:20px;display:block}.stat small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translate(-50%,20px);background:var(--accent);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.small-note{font-size:11px;color:var(--muted);line-height:1.45;margin-top:10px}
</style></head>
<body>
<div class="app">
 <div class="header"><div><div class="eyebrow">KİŞİSEL DÖNÜŞÜM</div><div class="title">Bugünün Planı</div><div class="muted">Antrenman · Beslenme · İlerleme</div></div><div class="streak"><b id="streak">0</b><span>GÜN SERİ</span></div></div>
 <div class="card nav"><button id="prev">‹</button><div class="date"><b id="day"></b><small id="date"></small></div><button id="next">›</button></div>
 <div class="tabs"><button class="tab active" data-tab="today">Bugün</button><button class="tab" data-tab="historyPage">Geçmiş</button><button class="tab" data-tab="reportPage">Rapor</button></div>
 <main id="today">
  <div class="card"><div class="section"><h3>💧 Su</h3><span class="muted" id="water"></span></div><div class="progress"><div class="bar" id="wbar"></div></div><div class="water-buttons"><button class="btn" data-w="250">+250 ml</button><button class="btn" data-w="500">+500 ml</button><button class="btn" id="wreset">Sıfırla</button></div></div>
  <div class="card"><div class="section"><h3>🏋️ <span id="focus"></span></h3><span class="muted" id="time"></span></div><div class="section"><span class="muted" id="count"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="exercises"></div><textarea id="exerciseNote" placeholder="Antrenman notu..."></textarea></div>
  <div class="card"><h3>🍽️ Beslenme</h3><div id="meals"></div></div>
  <div class="card"><h3>📏 Günlük Ölçüm</h3><div class="grid"><div><span class="muted">Kilo (kg)</span><input id="weight" type="number" step=".1" placeholder="kg"></div><div><span class="muted">Adım</span><input id="steps" type="number" placeholder="10000"></div></div></div>
  <div class="card"><h3>📝 Günün Notu</h3><textarea id="note" placeholder="Bugün nasıl geçti?"></textarea></div>
 </main>
 <main id="historyPage" class="hidden"><div class="card"><h3>Geçmiş · Son 7 Gün</h3><div id="history"></div></div></main>
 <main id="reportPage" class="hidden"><div class="card"><h3>📊 Haftalık Rapor</h3><div id="report"></div></div></main>
</div>
<div id="toast" class="toast">Kaydedildi</div>
<script>const PLAN = {"Pazartesi": {"focus": "Omuz & Üst Gövde (V-Taper)", "time": "20:15–20:55 · Ev", "items": ["Şınav — 4 set × maksimum tekrar", "Pike Push-Up (omuz şınavı) — 4 × 8–12", "Lateral Raise (bant/şişe) — 4 × 15–20", "Band Pull-Apart / kapı altı row — 4 × 12–15", "Plank — 3 × 45–60 sn"]}, "Salı": {"focus": "Kardiyo & Yağ Yakımı", "time": "20:15–21:00 · Dışarı", "items": ["Tempolu yürüyüş/bisiklet — 45–50 dk (orta tempo, konuşabilecek kadar hızlı)", "Lying Leg Raise — 3 × 15", "Crunch — 3 × 20"]}, "Çarşamba": {"focus": "Omuz, Sırt & Basen Sıkılaştırma", "time": "20:15–20:55 · Ev", "items": ["Pike Push-Up — 4 × 8–12", "Lateral Raise — 4 × 15–20", "Lunge (bacak başına) — 3 × 12", "Glute Bridge — 3 × 15", "Side Plank — 3 × 30 sn (iki taraf)"]}, "Perşembe": {"focus": "Kardiyo & Adım", "time": "20:15–21:00 · Dışarı", "items": ["Tempolu yürüyüş/bisiklet — 45–50 dk", "Günlük adım hedefi — minimum 10.000 adım"]}, "Cuma": {"focus": "Omuz & V-Taper", "time": "20:15–20:55 · Ev", "items": ["Şınav — 4 set × maksimum", "Pike Push-Up — 4 × 10–12", "Lateral Raise — 5 × 15", "Band Pull-Apart / sırt çekiş — 4 × 15", "Plank — 4 × 45 sn"]}, "Cumartesi": {"focus": "Alt Gövde Sıkılaştırma & Core", "time": "Esnek saat · Ev", "items": ["Lunge — 3 × 12", "Glute Bridge — 4 × 15", "Mountain Climber — 3 × 30 sn", "Lying Leg Raise — 3 × 15"]}, "Pazar": {"focus": "Tam Dinlenme", "time": "Esnek saat", "items": ["Vücut toparlanması için dinlenme", "İstersen 30–45 dk hafif yürüyüş veya esneme"]}};
const MEALS = [["Kahvaltı", "07:15–07:45", "3 yumurta (2 tam + 1 beyaz), 50 gr lor peyniri veya süzme yoğurt, 4–5 kaşık yulaf, domates-salatalık-yeşillik, 2 ceviz veya 5–6 badem"], ["Öğle Yemeği", "12:00–13:00", "Et/tavuk/köfte tam porsiyon + pilav/makarna max 4–5 kaşık + bol salata. Bakliyat varsa tam porsiyon + 2–3 kaşık pilav + 1 kase yoğurt/cacık. Tatlı ve gazlı içecek yok."], ["Ara Öğün", "17:30–18:00", "1 elma/muz + 5–6 çiğ badem/ceviz VEYA 1 kutu süzme yoğurt/kefir"], ["Akşam Yemeği", "19:15–19:45", "180–200 gr tavuk göğsü/hindi/ton balığı/balık + bol yeşillik salata veya fırın/buhar sebze"]];

const STORE="donusum-v2-",DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"],WATER_GOAL=4000;
let cur=new Date();cur.setHours(12,0,0,0);
const $=s=>document.querySelector(s);
const key=d=>STORE+d.toISOString().slice(0,10);
const blank=()=>({water:0,weight:"",steps:"",note:"",exerciseNote:"",ex:{},meals:MEALS.map(()=>({done:false,text:""}))});
function load(d){try{return JSON.parse(localStorage.getItem(key(d)))||blank()}catch{return blank()}}
function save(d,notify=true){localStorage.setItem(key(cur),JSON.stringify(d));if(notify)toast()}
function toast(){let t=$("#toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),650)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){
 const d=load(cur),name=DAYS[cur.getDay()],p=PLAN[name],done=p.items.filter((_,i)=>d.ex[i]).length;
 $("#day").textContent=name;$("#date").textContent=cur.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
 $("#focus").textContent=p.focus;$("#time").textContent=p.time;$("#count").textContent=`${done}/${p.items.length} tamamlandı`;
 $("#bar").style.width=(done/p.items.length*100)+"%";
 $("#water").textContent=`${d.water||0} / ${WATER_GOAL} ml`;$("#wbar").style.width=Math.min(100,(d.water||0)/WATER_GOAL*100)+"%";
 $("#exercises").innerHTML=p.items.map((x,i)=>`<label class="exercise ${d.ex[i]?"done":""}"><input data-e="${i}" type="checkbox" ${d.ex[i]?"checked":""}><span>${esc(x)}</span></label>`).join("");
 $("#exerciseNote").value=d.exerciseNote||"";
 $("#meals").innerHTML=MEALS.map((m,i)=>`<div class="meal"><div class="meal-head"><div><span class="meal-title">${m[0]}</span><span class="meal-time">${m[1]}</span></div><label class="muted"><input data-md="${i}" type="checkbox" ${d.meals[i].done?"checked":""}> tamam</label></div><textarea data-mt="${i}" placeholder="${esc(m[2])}">${esc(d.meals[i].text)}</textarea></div>`).join("");
 $("#weight").value=d.weight||"";$("#steps").value=d.steps||"";$("#note").value=d.note||"";
 document.querySelectorAll("[data-e]").forEach(el=>el.onchange=()=>{d.ex[+el.dataset.e]=el.checked;save(d);render()});
 document.querySelectorAll("[data-md]").forEach(el=>el.onchange=()=>{d.meals[+el.dataset.md].done=el.checked;save(d)});
 document.querySelectorAll("[data-mt]").forEach(el=>el.oninput=()=>{d.meals[+el.dataset.mt].text=el.value;save(d,false)});
 ["exerciseNote","weight","steps","note"].forEach(id=>$("#"+id).oninput=e=>{d[id]=e.target.value;save(d,false)});
 updateStreak();
}
function updateStreak(){
 let d=new Date();d.setHours(12,0,0,0);let n=0;
 while(localStorage.getItem(key(d))){n++;d.setDate(d.getDate()-1);if(n>366)break}
 $("#streak").textContent=n;
}
function history(){
 let arr=[];
 for(let i=6;i>=0;i--){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);let x=localStorage.getItem(key(d));if(x)arr.push({d,x:JSON.parse(x)})}
 $("#history").innerHTML=arr.length?arr.reverse().map(o=>{let p=PLAN[DAYS[o.d.getDay()]],n=p.items.filter((_,i)=>o.x.ex[i]).length;return `<div class="report"><b>${DAYS[o.d.getDay()]} · ${o.d.toLocaleDateString("tr-TR")}</b><small>${p.focus} · Antrenman ${n}/${p.items.length} · Su ${o.x.water||0} ml${o.x.weight?" · "+o.x.weight+" kg":""}${o.x.steps?" · "+o.x.steps+" adım":""}</small></div>`}).join(""):`<div class="empty">Henüz kayıt yok.</div>`;
}
function report(){
 let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);days.push({d,x:localStorage.getItem(key(d))?JSON.parse(localStorage.getItem(key(d))):null})}
 let logged=days.filter(x=>x.x),water=logged.length?Math.round(logged.reduce((s,x)=>s+(x.x.water||0),0)/logged.length):0,weights=logged.filter(x=>x.x.weight).map(x=>Number(x.x.weight)).filter(Number.isFinite);
 $("#report").innerHTML=`<div class="grid"><div class="stat"><b>${logged.length}/7</b><small>Kayıtlı gün</small></div><div class="stat"><b>${water} ml</b><small>Ortalama su</small></div></div>${weights.length?`<div class="report" style="margin-top:8px"><b>Kilo</b><small>İlk kayıt: ${weights[0]} kg · Son kayıt: ${weights.at(-1)} kg</small></div>`:""}${days.map(o=>`<div class="report"><b>${DAYS[o.d.getDay()]} · ${o.d.toLocaleDateString("tr-TR")}</b><small>${o.x?`Su ${o.x.water||0} ml${o.x.steps?" · "+o.x.steps+" adım":""}`:"Kayıt yok"}</small></div>`).join("")}`;
}
$("#prev").onclick=()=>{cur.setDate(cur.getDate()-1);render()};
$("#next").onclick=()=>{cur.setDate(cur.getDate()+1);render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");["today","historyPage","reportPage"].forEach(id=>$("#"+id).classList.add("hidden"));$("#"+b.dataset.tab).classList.remove("hidden");if(b.dataset.tab==="historyPage")history();if(b.dataset.tab==="reportPage")report()});
document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{let d=load(cur);d.water+=Number(b.dataset.w);save(d);render()});
$("#wreset").onclick=()=>{let d=load(cur);d.water=0;save(d);render()};
render();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");</script>
</body></html>
